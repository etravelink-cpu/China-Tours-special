<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Etrips 国安易游 | 易行天下，奔赴山海 · 定制游</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>
  <section class="section" style="padding-top:80px">
    <div class="container">
      <h2 class="section-title" data-i18n="custom.title">定制游需求</h2>
      <div class="form-card">
        <form onsubmit="return EtripsForm.submit(event)">
          <div class="form-row"><label data-i18n="form.name">姓名</label><input required name="name"></div>
          <div class="form-row"><label data-i18n="form.phone">电话</label><input required name="phone"></div>
          <div class="form-row"><label data-i18n="form.dest">目的地</label>
            <select name="dest"><option>澳洲境内</option><option>新西兰</option><option>中国全境</option><option>亚洲/海岛</option></select></div>
          <div class="form-row"><label data-i18n="form.date">出行时间</label><input name="date" type="month"></div>
          <div class="form-row"><label data-i18n="form.pax">人数</label><input name="pax" type="number" min="1" value="2"></div>
          <div class="form-row"><label data-i18n="custom.budget">预算</label>
            <select name="budget"><option>经济</option><option>中端</option><option>高端</option></select></div>
          <div class="form-row"><label data-i18n="custom.pref">出行偏好</label>
            <textarea name="pref" rows="3" placeholder="如：亲子、蜜月、摄影、无购物..."></textarea></div>
          <button class="btn btn-primary" style="width:100%" data-i18n="btn.submit">提交</button>
        </form>
        <p id="form-msg" style="margin-top:12px;color:#1f7a4d;font-size:14px"></p>
      </div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script>window.EtripsForm={submit(e){e.preventDefault();const l=window.Etrips.getLang();document.getElementById('form-msg').textContent=l==='zh'?'✅ 已收到定制需求，顾问将尽快联系您！':'✅ Request received, advisor will contact you!';e.target.reset();return false;}}</script>
</body>
</html>
