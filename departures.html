<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Etrips 国安易游 | 易行天下，奔赴山海 · 团期价格</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>
  <section class="section" style="padding-top:80px">
    <div class="container">
      <h2 class="section-title" data-i18n="dep.title">团期价格查询</h2>
      <div class="grid grid-3" id="dep-grid"></div>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
  (function(){
    const D=window.DEPARTURES,T=window.TOURS,I=window.I18N;
    function render(){
      const lang=window.Etrips.getLang();
      document.getElementById('dep-grid').innerHTML=D.map(d=>{
        const t=T.find(x=>x.id===d.id)||{nameZh:d.id,nameEn:d.id};
        const seats = d.seats<=3 ? (lang==='zh'?'仅余 '+d.seats+' 位':'Only '+d.seats+' left') : (lang==='zh'?d.seats+' 位可订':d.seats+' seats');
        return `<div class="card"><div class="body">
          <h3>${lang==='zh'?t.nameZh:t.nameEn}</h3>
          <p class="muted">${d.date}</p>
          <p><span class="price">${d.price}</span></p>
          <p class="muted">${seats}</p>
          <a href="detail.html?id=${d.id}" class="btn btn-outline" data-i18n="btn.detail">查看详情</a>
        </div></div>`;
      }).join('');
      window.Etrips.applyLang({ emit: false });
    }
    document.addEventListener('DOMContentLoaded',render);
    window.addEventListener('langchange',render);
  })();
  </script>
</body>
</html>
