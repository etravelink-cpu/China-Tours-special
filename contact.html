<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>在线咨询 · Etrips 国安易游</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>

  <section class="section" style="padding-top:80px">
    <div class="container">
      <h2 class="section-title" style="text-align:center">在线咨询 / 行程预订</h2>
      <p style="text-align:center;color:#666;margin:0 0 28px">提交后将通过 WhatsApp 直接发送咨询消息；也可扫描下方二维码添加微信客服。</p>

      <div class="form-card" style="max-width:640px">
        <div class="grid grid-2" style="gap:16px">
          <div class="form-row" style="margin:0">
            <label>姓名 / Name</label>
            <input id="c-name" type="text" placeholder="您的称呼" autocomplete="name">
          </div>
          <div class="form-row" style="margin:0">
            <label>联系电话 / Phone</label>
            <input id="c-phone" type="tel" placeholder="微信或手机号" autocomplete="tel">
          </div>
        </div>
        <div class="form-row" style="margin-top:16px">
          <label>咨询内容 / Message</label>
          <textarea id="c-msg" rows="6" placeholder="请描述您想咨询的行程、人数、预算等"></textarea>
        </div>
        <div style="text-align:center;margin-top:22px">
          <a href="javascript:void(0)" class="btn btn-primary" onclick="submitConsult()">提交咨询</a>
        </div>
        <div id="c-tip" style="text-align:center;color:#1B9FE0;margin-top:14px;font-size:14px"></div>
      </div>

      <div id="contact-channels" style="max-width:640px;margin:30px auto 0"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/region-plans.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
    (function(){
      const q = new URLSearchParams(location.search);
      const route = q.get('route') || '';
      const date = q.get('date') || '';
      const ta = document.getElementById('c-msg');
      if(route){
        let pre = '我想咨询：【' + route + '】';
        if(date) pre += '\n意向出发日期：' + date;
        pre += '\n\n';
        ta.value = pre + ta.placeholder.replace(/^/,'');
        ta.focus();
      }
      // 注入客服渠道（5 通道）
      const ch = document.getElementById('contact-channels');
      if(window.contactChannels) ch.innerHTML = window.contactChannels(window.Etrips ? window.Etrips.getLang() : 'zh');
    })();

    function submitConsult(){
      const name = document.getElementById('c-name').value.trim();
      const phone = document.getElementById('c-phone').value.trim();
      const msg = document.getElementById('c-msg').value.trim();
      const tip = document.getElementById('c-tip');
      if(!phone){ tip.style.color='#e23b3b'; tip.textContent='请留下联系电话或微信，方便客服与您确认。'; return; }
      // 咨询走 WhatsApp：预填消息直接发送；微信见下方二维码
      let lines = ['【咨询】Etrips 国安易游'];
      if(name) lines.push('称呼：' + name);
      lines.push('联系方式：' + phone);
      if(msg) lines.push('咨询内容：\n' + msg);
      const wa = (window.CONTACT && window.CONTACT.whatsapp || '+61 410 740 695').replace(/[^0-9]/g,'');
      location.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(lines.join('\n'));
    }
  </script>
  <script src="assets/js/list.js"></script>
</body>
</html>
