<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Etrips 国安易游 | 易行天下，纵览山海 · 联系我们</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>
  <section class="section" style="padding-top:80px">
    <div class="container" style="max-width:720px">
      <h2 class="section-title" data-i18n="contact.title">联系我们</h2>
      <div class="form-card">
        <form onsubmit="return EtripsForm.submit(event)">
          <div class="form-row"><label data-i18n="form.name">姓名</label><input required name="name"></div>
          <div class="form-row"><label data-i18n="form.phone">电话</label><input required name="phone"></div>
          <div class="form-row"><label data-i18n="form.dest">目的地</label>
            <select name="dest"><option>澳洲境内</option><option>新西兰</option><option>中国全境</option><option>欧洲</option><option>邮轮</option><option>亚洲/海岛</option><option>定制游</option></select></div>
          <div class="form-row"><label data-i18n="form.date">出行时间</label><input name="date" type="month"></div>
          <div class="form-row"><label data-i18n="form.pax">人数</label><input name="pax" type="number" min="1" value="2"></div>
          <div class="form-row"><label data-i18n="form.notes">需求备注</label><textarea name="notes" rows="3" placeholder="请告诉我们您的出行偏好、特殊需求或想咨询的问题…"></textarea></div>
          <button class="btn btn-primary" style="width:100%" data-i18n="btn.submit">提交</button>
        </form>
        <p id="form-msg" style="margin-top:12px;color:#1f7a4d;font-size:14px"></p>
      </div>
      <p style="text-align:center;margin-top:18px;color:var(--text-soft);font-size:14px" data-i18n="contact.below">更多联系方式请见页脚。</p>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script>window.EtripsForm={submit(e){e.preventDefault();const l=window.Etrips.getLang();document.getElementById('form-msg').textContent=l==='zh'?'✅ 已收到您的咨询，顾问将尽快与您联系！':'✅ We received your request, an advisor will contact you soon!';e.target.reset();return false;}};</script>
</body>
</html>
