<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>预订请求 · Etrips 国安易游</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .bk-wrap{max-width:680px;margin:0 auto}
    .bk-card{background:#fff;border:1px solid #e6eef5;border-radius:14px;padding:22px;box-shadow:0 4px 14px rgba(14,42,71,.06)}
    .bk-row{margin-bottom:18px}
    .bk-row label{display:block;font-size:14px;font-weight:600;color:#333;margin-bottom:8px}
    .bk-row .req{color:#e23b3b;margin-left:2px}
    .bk-input,.bk-select{padding:10px 12px;border:1px solid #d6e3ee;border-radius:8px;font-size:14px;font-family:inherit;width:100%;box-sizing:border-box;color:#333}
    .bk-input:focus,.bk-select:focus{outline:none;border-color:#1B9FE0}
    .bk-pax{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
    .bk-pax:last-child{border-bottom:0}
    .bk-pax-name{font-size:15px;font-weight:600;color:#333}
    .bk-pax-price{font-size:12px;color:#888;margin-top:2px}
    .bk-stepper{display:flex;align-items:center;gap:10px}
    .bk-stepper button{width:32px;height:32px;border-radius:8px;border:1px solid #d6e3ee;background:#fff;font-size:18px;cursor:pointer;color:#1B9FE0;line-height:1}
    .bk-stepper button:hover{background:#e9f4fc}
    .bk-stepper input{width:46px;text-align:center;border:1px solid #d6e3ee;border-radius:8px;padding:7px 0;font-size:14px}
    .bk-subtotal{background:#f0f7fc;border-radius:10px;padding:14px 16px;margin:18px 0;font-size:15px}
    .bk-subtotal b{color:#1B9FE0;font-size:18px}
    .bk-note{font-size:12px;color:#999;margin-top:6px;line-height:1.6}
    .bk-actions{display:flex;gap:12px;margin-top:8px}
    .bk-actions .btn{flex:1;text-align:center}
    .bk-detail{margin:30px auto 0;background:#fff;border:1px solid #e6eef5;border-radius:14px;padding:22px;box-shadow:0 4px 14px rgba(14,42,71,.06)}
    .bk-detail-title{font-size:18px;color:#1B9FE0;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid #1B9FE0}
    .bk-detail-body .rp-sec{padding:0 0 16px;border-bottom:1px solid #f0f0f0}
    .bk-detail-body .rp-sec:last-child{border-bottom:0}
    .bk-detail-body .rp-sec h4{font-size:15px;color:#222;margin:0 0 8px;padding-left:10px;border-left:3px solid #1B9FE0}
    .bk-detail-body .rp-sec p,.bk-detail-body .rp-sec li{color:#444;font-size:14px;line-height:1.7}
    .bk-detail-empty{color:#999;font-size:13px;text-align:center;padding:10px 0}
    @media(max-width:760px){.bk-actions{flex-direction:column}}
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>

  <section class="section" style="padding-top:80px">
    <div class="container">
      <h2 class="section-title" style="text-align:center">行程预订请求</h2>
      <a href="index.html" class="back-btn" style="display:inline-block;margin:0 auto 18px">← 返回主页</a>
      <p style="text-align:center;color:#666;margin:0 0 24px">填写路线、日期与乘客信息，提交后行程单将随邮件发至客服，客服将尽快与您确认余位与价格。</p>

      <div class="bk-wrap">
        <div class="bk-card">
          <div class="bk-row">
            <label>路线 / Route<span class="req">*</span></label>
            <input id="bk-route" class="bk-input" type="text" placeholder="如：蓝山有氧+动物园一日游" oninput="renderDetail(this.value.trim())">
          </div>
          <div class="bk-row">
            <label>出发日期 / Date<span class="req">*</span></label>
            <input id="bk-date" class="bk-input" type="date">
          </div>

          <div class="bk-row">
            <label>乘客人数 / Passengers</label>
            <div id="bk-pax">
              <div class="bk-pax" data-type="成人" data-price="0">
                <div><div class="bk-pax-name">成人 Adult</div><div class="bk-pax-price" data-price-label>单价：待确认</div></div>
                <div class="bk-stepper"><button type="button" onclick="step(this,-1)">−</button><input type="number" min="0" value="0" onchange="recalc()"><button type="button" onclick="step(this,1)">+</button></div>
              </div>
              <div class="bk-pax" data-type="儿童" data-price="0">
                <div><div class="bk-pax-name">儿童 Child</div><div class="bk-pax-price" data-price-label>单价：待确认</div></div>
                <div class="bk-stepper"><button type="button" onclick="step(this,-1)">−</button><input type="number" min="0" value="0" onchange="recalc()"><button type="button" onclick="step(this,1)">+</button></div>
              </div>
              <div class="bk-pax" data-type="婴儿" data-price="0">
                <div><div class="bk-pax-name">婴儿 Infant</div><div class="bk-pax-price" data-price-label>单价：待确认</div></div>
                <div class="bk-stepper"><button type="button" onclick="step(this,-1)">−</button><input type="number" min="0" value="0" onchange="recalc()"><button type="button" onclick="step(this,1)">+</button></div>
              </div>
            </div>
            <div class="bk-note">价格以客服最终确认为准；本页单价为占位，待官方公布后更新。</div>
          </div>

          <div class="bk-subtotal">预估小计：<b id="bk-total">待确认</b></div>

          <div class="bk-row">
            <label>联系人 / Name<span class="req">*</span></label>
            <input id="bk-name" class="bk-input" type="text" placeholder="您的称呼" autocomplete="name">
          </div>
          <div class="bk-row">
            <label>客人邮箱 / Email</label>
            <input id="bk-email" class="bk-input" type="email" placeholder="用于接收确认邮件（选填）" autocomplete="email">
          </div>
          <div class="bk-row">
            <label>联系电话 / Phone<span class="req">*</span></label>
            <input id="bk-phone" class="bk-input" type="tel" placeholder="微信或手机号" autocomplete="tel">
          </div>
          <div class="bk-row">
            <label>备注 / Remark</label>
            <textarea id="bk-remark" class="bk-input" rows="3" placeholder="特殊需求、接送地址等"></textarea>
          </div>

          <div class="bk-actions">
            <button type="button" class="btn btn-primary" onclick="submitBookingMail()">提交预订申请（邮件发送）</button>
          </div>
          <div id="bk-tip" style="text-align:center;margin-top:14px;font-size:14px;color:#1B9FE0"></div>
        </div>
        <div id="bk-detail" class="bk-detail" style="margin-top:24px;display:none">
          <h3 class="bk-detail-title" id="bk-detail-title"></h3>
          <div id="bk-detail-body"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/region-plans.js"></script>
  <script src="assets/js/site.js?v=20260803c"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (function(){
      const q = new URLSearchParams(location.search);
      const tour = q.get('tour') || '';
      const route = q.get('route') || '';
      const date = q.get('date') || '';
      // 优先按 ?tour=ID 从产品库取产品，否则用 ?route= 路线名
      let product = null, routeName = route;
      if(tour && window.TOURS){
        product = window.TOURS.find(function(x){ return x.id === tour; });
      }
      if(product){ routeName = product.nameZh || product.nameEn || product.id; }
      if(routeName) document.getElementById('bk-route').value = routeName;
      if(date) document.getElementById('bk-date').value = date;
      renderDetail(routeName, product);
      if(typeof emailjs !== 'undefined'){ try{ emailjs.init('nZv17YnCO1xz5uLPZ'); }catch(e){} }

      function renderDetail(routeName, product){
        const box = document.getElementById('bk-detail');
        const body = document.getElementById('bk-detail-body');
        const titleEl = document.getElementById('bk-detail-title');
        body.innerHTML = '';
        // 路径A：产品库命中 -> 用产品自身数据渲染行程单 + 价格
        if(product){
          titleEl.textContent = '产品详情：' + (product.nameZh || product.nameEn || product.id);
          injectProductDetail(product);
          box.style.display = 'block';
          return;
        }
        // 路径B：兼容旧 ?route= 匹配 REGION_PLANS
        if(!routeName || !window.REGION_PLANS){ box.style.display='none'; return; }
        let found = null;
        for(const key in window.REGION_PLANS){
          const tmp = document.createElement('div');
          tmp.innerHTML = window.REGION_PLANS[key];
          const panes = tmp.querySelectorAll('.rp-route-pane');
          for(const p of panes){
            const h = p.querySelector('.rp-detail-hero-in h3');
            const t = h ? h.textContent.replace(/【|】|\s/g,'') : '';
            const rn = routeName.replace(/【|】|\s/g,'');
            if(t && rn && t.indexOf(rn) > -1){ found = p; break; }
          }
          if(found) break;
        }
        if(!found){ box.style.display='none'; return; }
        const title = found.querySelector('.rp-detail-hero-in h3');
        if(title) titleEl.textContent = '产品详情：' + title.textContent;
        const pa = parseFloat(found.getAttribute('data-p-adult'))||0;
        const pc = parseFloat(found.getAttribute('data-p-child'))||0;
        const pi = parseFloat(found.getAttribute('data-p-infant'))||0;
        applyPaxPrices([pa,pc,pi]);
        const secs = found.querySelectorAll('.rp-sec');
        if(!secs.length){ box.style.display='none'; return; }
        secs.forEach(s=> body.appendChild(s.cloneNode(true)));
        box.style.display = 'block';
      }

      // 用产品库数据渲染行程单 + 注入价格到乘客步进器
      function injectProductDetail(p){
        const body = document.getElementById('bk-detail-body');
        // 1) 价格表 -> 步进器单价
        let pa=0, pc=0, pi=0;
        const pt = p.priceTable;
        if(Array.isArray(pt) && pt.length){
          const row = pt[0];
          const num = function(v){ const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:n; };
          pa = num(row.adult); pc = num(row.childbed)||num(row.childnobed); pi = num(row.infant);
        }
        applyPaxPrices([pa,pc,pi]);
        // 2) 行程单：产品介绍 + 行程 + 价格表
        const secs = [];
        if(p.introZh){ secs.push({h:'产品介绍', p:p.introZh}); }
        if(p.itinerary){
          const it = (typeof p.itinerary === 'string') ? JSON.parse(p.itinerary) : p.itinerary;
          if(Array.isArray(it)){ it.slice(0,12).forEach(function(d){ secs.push({h:(d.titleZh||d.d||''), p:(d.descZh||'')}); }); }
        }
        if(Array.isArray(pt) && pt.length){
          const lines = pt.map(function(r){
            return [r.city, r.adult, r.childbed, r.childnobed, r.infant, r.single, r.service, r.tip, r.transfer].filter(function(x){return x!==''&&x!=null;}).join(' | ');
          }).filter(Boolean);
          if(lines.length) secs.push({h:'价格明细', p: lines.join('\n')});
        }
        secs.forEach(function(s){
          const el = document.createElement('div');
          el.className = 'rp-sec';
          const h = document.createElement('h4'); h.textContent = s.h;
          const pEl = document.createElement('p'); pEl.textContent = s.p;
          el.appendChild(h); el.appendChild(pEl);
          body.appendChild(el);
        });
      }

      function applyPaxPrices(prices){
        const paxRows = document.querySelectorAll('#bk-pax .bk-pax');
        paxRows.forEach(function(r,i){
          const p = prices[i]||0;
          r.setAttribute('data-price', p);
          const lab = r.querySelector('[data-price-label]');
          if(lab) lab.textContent = p>0 ? ('单价：A$ ' + p.toFixed(0)) : '单价：待确认';
        });
      }

    function step(btn, d){
      const inp = btn.parentElement.querySelector('input');
      let v = parseInt(inp.value,10) || 0;
      v = Math.max(0, v + d);
      inp.value = v; recalc();
    }
    function recalc(){
      // 单价占位：待确认 -> 小计显示"待确认"
      const rows = document.querySelectorAll('#bk-pax .bk-pax');
      let anyQty = false, allKnown = true;
      rows.forEach(r=>{
        const n = parseInt(r.querySelector('input').value,10)||0;
        if(n>0) anyQty = true;
        const p = parseFloat(r.getAttribute('data-price'))||0;
        if(n>0 && p===0) allKnown = false;
      });
      const total = document.getElementById('bk-total');
      if(!anyQty){ total.textContent = '待确认'; return; }
      if(!allKnown){ total.textContent = '待确认（价格待官方公布）'; return; }
      let sum = 0;
      rows.forEach(r=>{ const n=parseInt(r.querySelector('input').value,10)||0; const p=parseFloat(r.getAttribute('data-price'))||0; sum += n*p; });
      total.textContent = 'A$ ' + sum.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function buildMsg(){
      const route = document.getElementById('bk-route').value.trim();
      renderDetail(route); // 提交前按当前路线刷新详情，确保邮件含行程单
      const date = document.getElementById('bk-date').value;
      const name = document.getElementById('bk-name').value.trim();
      const phone = document.getElementById('bk-phone').value.trim();
      const remark = document.getElementById('bk-remark').value.trim();
      const email = document.getElementById('bk-email').value.trim();
      const tourId = (new URLSearchParams(location.search).get('tour') || '');
      let lines = ['【预订请求】'];
      if(tourId) lines.push('产品ID：' + tourId);
      if(route) lines.push('路线：' + route);
      if(date) lines.push('出发日期：' + date);
      const rows = document.querySelectorAll('#bk-pax .bk-pax');
      let pax = [];
      rows.forEach(r=>{ const n=parseInt(r.querySelector('input').value,10)||0; if(n>0) pax.push(r.getAttribute('data-type')+'×'+n); });
      if(pax.length) lines.push('乘客：' + pax.join('，'));
      lines.push('联系人：' + (name||'-') + ' / ' + (phone||'-') + (email?' / '+email:''));
      if(remark) lines.push('备注：' + remark);
      const total = document.getElementById('bk-total').textContent;
      lines.push('预估小计：' + total);
      // 附上产品详情（行程单内容），等效随信附件
      const detailBody = document.getElementById('bk-detail-body');
      if(detailBody && detailBody.children.length){
        lines.push('');
        lines.push('———— 行程单 ————');
        detailBody.querySelectorAll('.rp-sec').forEach(sec=>{
          const h = sec.querySelector('h4'); const p = sec.querySelector('p');
          if(h) lines.push('\n' + h.textContent);
          if(p) lines.push(p.textContent.replace(/\s+/g,' ').trim());
        });
      }
      return lines.join('\n');
    }
    // 生成行程单 PDF（打印态），返回 Blob 供邮件附件
    function buildItineraryPDF(){
      return new Promise((resolve)=>{
        const detail = document.getElementById('bk-detail');
        if(!detail || detail.style.display==='none'){ resolve(null); return; }
        const w = window.open('', '_blank');
        if(!w){ resolve(null); return; }
        const css = Array.from(document.styleSheets).map(s=>{ try{return Array.from(s.cssRules).map(r=>r.cssText).join('');}catch(e){return '';} }).join('');
        w.document.write('<html><head><title>行程单</title><style>'+css+' .bk-detail{box-shadow:none;border:0} @media print{body{print-color-adjust:exact}}</style></head><body>'+detail.innerHTML+'</body></html>');
        w.document.close();
        setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} resolve(null); }, 600);
      });
    }
    function submitBookingMail(){
      const tip = document.getElementById('bk-tip');
      const route = document.getElementById('bk-route').value.trim();
      const date = document.getElementById('bk-date').value;
      const phone = document.getElementById('bk-phone').value.trim();
      if(!route || !date){ tip.style.color='#e23b3b'; tip.textContent='请填写路线与出发日期。'; return; }
      if(!phone){ tip.style.color='#e23b3b'; tip.textContent='请留下联系电话或微信。'; return; }
      const name = document.getElementById('bk-name').value.trim();
      const email = document.getElementById('bk-email').value.trim();
      const remark = document.getElementById('bk-remark').value.trim();
      const body = buildMsg();
      // ---- 真实发送：EmailJS（纯前端）----
      const EMAILJS = { serviceID:'service_o6p45jq', templateID:'template_yxlb4dp', autoReplyID:'template_p9ks58v', publicKey:'nZv17YnCO1xz5uLPZ', toEmail:'etripsetrips@gmail.com' };
      if(typeof emailjs === 'undefined'){
        tip.style.color='#e23b3b';
        tip.textContent='邮件组件加载失败，请检查网络后重试，或通过微信联系客服。';
        return;
      }
      tip.style.color='#1B9FE0'; tip.textContent='正在发送…';
      const rows = document.querySelectorAll('#bk-pax .bk-pax');
      let pax = [];
      rows.forEach(r=>{ const n=parseInt(r.querySelector('input').value,10)||0; if(n>0) pax.push(r.getAttribute('data-type')+'×'+n); });
      try {
        emailjs.send(EMAILJS.serviceID, EMAILJS.templateID, {
          route: route, date: date, name: name, phone: phone, email: email, remark: remark,
          pax: pax.join('，'), body: body
        }).then(()=>{
          if(email && EMAILJS.autoReplyID){
            emailjs.send(EMAILJS.serviceID, EMAILJS.autoReplyID, {
              name: name, email: email, body: body, route: route, date: date
            }).catch(()=>{});
          }
          tip.style.color='#1aa06b'; tip.textContent='预订请求已发送！行程单已随邮件送达，客服将尽快与您确认余位与价格（可扫码添加微信）。';
        }).catch((err)=>{
          tip.style.color='#e23b3b'; tip.textContent='发送失败（'+(err&&err.status||'网络')+'），请稍后重试或通过微信联系客服。';
          console.error(err);
        });
      } catch(e){
        tip.style.color='#e23b3b'; tip.textContent='发送初始化失败：'+(e.message||e)+'，请刷新页面后重试。';
        console.error(e);
      }
    }
    window.step = step;
    window.recalc = recalc;
    window.submitBookingMail = submitBookingMail;
    window.renderDetail = renderDetail;
    })();
  </script>
</body>
</html>
