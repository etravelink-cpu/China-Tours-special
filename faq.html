      <h2 class="section-title" data-i18n="faq.title">常见问题</h2>
      <details class="faq-item" id="custom"><summary data-i18n="faq.custom.q">可以安排私人订制吗？</summary><div class="ans" data-i18n="faq.custom.a">可以提交目的地、人数和偏好，顾问将与您确认可行方案及报价。</div></details>
<details class="faq-item" id="flights"><summary data-i18n="faq.flights.q">价格包含机票吗？</summary><div class="ans" data-i18n="faq.flights.a">不同方案的包含项目不同。请向顾问确认所选方案是否含机票、行李及接送。</div></details>
<details class="faq-item" id="rooms"><summary data-i18n="faq.rooms.q">单人出行如何安排？</summary><div class="ans" data-i18n="faq.rooms.a">请向顾问确认单人房、拼房是否可安排，以及适用费用。</div></details>
<details class="faq-item" id="preparation"><summary data-i18n="faq.preparation.q">出行前需要确认什么？</summary><div class="ans" data-i18n="faq.preparation.a">请核对姓名、出行日期和联系方式，并向顾问确认所需资料及行前安排。</div></details>
<details class="faq-item" id="changes"><summary data-i18n="faq.changes.q">如何确认付款和退改条件？</summary><div class="ans" data-i18n="faq.changes.a">请在确认预订前索取所选方案的书面费用、付款和退改条件；机票与地接可能适用不同条件。</div></details>
<details class="faq-item" id="language"><summary data-i18n="faq.language.q">可提供哪些语言服务？</summary><div class="ans" data-i18n="faq.language.a">可用中文或英文联系顾问；行程中的服务语言请按所选方案确认。</div></details>
