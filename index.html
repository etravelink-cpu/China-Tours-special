<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Etrips 国安易游 | 易行天下，奔赴山海</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>

  <!-- 板块1: Hero (4 张滚动展示) -->
  <section class="hero">
    <div id="hero-slides"></div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <!-- 板块2: 选择你的目的地 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="home.dest.title">选择你的目的地</h2>
      <div id="biz-grid"></div>
    </div>
  </section>

  <!-- 板块3: 爆款精选行程 -->
  <section class="section adv">
    <div class="container">
      <h2 class="section-title" data-i18n="home.hot.title">爆款精选行程</h2>
      <div class="grid grid-3" id="hot-grid"></div>
    </div>
  </section>

  <!-- 板块4: 服务优势 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="home.adv.title">四大服务优势</h2>
      <div class="grid grid-4" id="adv-grid"></div>
    </div>
  </section>

  <!-- 板块5: 客户评价 -->
  <section class="section adv">
    <div class="container">
      <h2 class="section-title" data-i18n="home.review.title">客户真实短评</h2>
      <div class="grid grid-3" id="review-grid"></div>
    </div>
  </section>

  <!-- 板块6: 出行小贴士 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="home.tips.title">出行小贴士</h2>
      <div class="grid grid-2" id="tips-grid"></div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
