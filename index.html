<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <title>Etrips 国安易游 | 易行天下，奔赴山海</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="float-bar" id="float-bar"></div>

  <!-- 板块1: Hero (4 张滚动展示) -->
  <section class="hero">
    <div id="hero-slides"></div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <!-- 板块2: 选择你的目的地 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="home.dest.title">选择你的目的地</h2>
      <div id="biz-grid"></div>
    </div>
  </section>

  <!-- 板块3: 爆款精选行程 -->
  <section class="section adv">
    <div class="container">
      <h2 class="section-title" data-i18n="home.hot.title">爆款精选行程</h2>
      <div class="grid grid-3" id="hot-grid"></div>
    </div>
  </section>

  <!-- 板块4: 服务优势 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="home.adv.title">四大服务优势</h2>
      <div class="grid grid-4" id="adv-grid"></div>
    </div>
  </section>

  <!-- 板块5: 客户评价 -->
  <section class="section adv">
    <div class="container">
      <h2 class="section-title" data-i18n="home.review.title">客户真实短评</h2>
      <div class="grid grid-3" id="review-grid"></div>
    </div>
  </section>

  <!-- 板块6: 出行小贴士 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="home.tips.title">出行小贴士</h2>
      <div class="grid grid-2" id="tips-grid"></div>
    </div>
  </section>

  <!-- 板块7: 咨询表单 -->
  <section class="section adv">
    <div class="container">
      <h2 class="section-title" data-i18n="home.form.title">在线咨询</h2>
      <div class="form-card">
        <form onsubmit="return EtripsForm.submit(event)">
          <div class="form-row"><label data-i18n="form.name">姓名</label><input required name="name" placeholder=""></div>
          <div class="form-row"><label data-i18n="form.phone">电话</label><input required name="phone" placeholder=""></div>
          <div class="form-row"><label data-i18n="form.dest">目的地</label>
            <select name="dest">
              <option>澳洲</option><option>新西兰</option><option>中国</option>
              <option>欧洲</option><option>亚洲</option><option>邮轮</option><option>私人订制</option>
            </select></div>
          <div class="form-row"><label data-i18n="form.date">出行时间</label><input name="date" type="date"></div>
          <input type="hidden" name="source" value="home-free-consult">
          <input type="hidden" name="tourRef" value="">
          <div class="form-row"><label data-i18n="form.pax">人数</label><input name="pax" type="number" min="1" value="2"></div>
          <div class="form-row"><label data-i18n="form.notes">需求备注</label><textarea name="notes" rows="3" data-i18n-ph="form.notes.ph" placeholder="请告诉我们您的出行偏好、特殊需求或想咨询的问题…"></textarea></div>
          <button class="btn btn-primary" style="width:100%" data-i18n="btn.submit">提交</button>
        </form>
        <p id="form-msg" style="margin-top:12px;color:#1f7a4d;font-size:14px"></p>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
